{% extends "base.html" %}

{% block title %}
    Page Not Found | PhishGuard
{% endblock %}

{% block content %}
<section class="error-page">
    <div>
        <h1>404</h1>

        <h2>Page not found</h2>

        <p>
            The page you requested does not exist.
        </p>

        <a
            class="button button-primary"
            href="{{ url_for('main.home') }}"
        >
            Return Home
        </a>
    </div>
</section>
{% endblock %}
